common:
  device: "auto"

train:
  trajs_pkl: "runs/dagger_10000steps/round0_cache_obs_payload_rel_v2_seeddelta_0.70_0.75/expert_trajs.pkl"
  out_dir: "runs/bc_chunk_h10_cfg"
  horizon: 10
  hidden: "512,512,256"
  activation: "tanh"
  epochs: 400
  batch_size: 64
  lr: 0.0003
  val_frac: 0.1
  max_windows: 0
  max_steps: 200
  seed: 0

eval:
  checkpoint: "runs/bc_chunk_h10_cfg/bc_chunk_best.pt"
  out_dir: "runs/bc_chunk_h10_cfg_eval"
  n_episodes: 20
  max_steps: 200
  replan_k: 10
  reset_sigma: 0.0
  seed: 123
  reward_clip_min: -20.0
  reward_clip_max: 2.0
  reward_normalize: true
  render_video: false
  video_views: "diag"
  video_fps: 50

eval-offline:
  checkpoint: "runs/bc_chunk_h10_cfg/bc_chunk_best.pt"
  trajs_pkl: "runs/dagger_10000steps/round0_cache_obs_payload_rel_v2_seeddelta_0.70_0.75/expert_trajs.pkl"
  out_dir: "runs/bc_chunk_h10_cfg_offline"
  max_windows: 2000
  batch_size: 1024
  seed: 123
